<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美食菜谱食谱大全</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <h1 class="logo">🍳 美食工坊</h1>
    <div class="header-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索菜名、食材、难度...">
        <button id="searchBtn">🔍</button>
      </div>
      <button id="themeToggle" class="theme-btn" title="切换主题">🌙</button>
    </div>
  </div>
  <nav class="nav">
    <div class="container nav-inner">
      <button class="cat-btn active" data-cat="全部">全部</button><button class="cat-btn " data-cat="家常菜">家常菜</button><button class="cat-btn " data-cat="烘焙甜点">烘焙甜点</button><button class="cat-btn " data-cat="川菜湘菜">川菜湘菜</button><button class="cat-btn " data-cat="西餐">西餐</button><button class="cat-btn " data-cat="减脂餐">减脂餐</button><button class="cat-btn " data-cat="汤羹">汤羹</button>
    </div>
  </nav>
</header>

<main class="container main">
  <div class="stats-bar">
    <span id="totalCount">共 0 条内容</span>
    <span id="lastUpdate">最后更新：--</span>
  </div>
  <div id="cardGrid" class="card-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;"><p>😢 没有找到相关内容</p></div>
  <div id="loadingState" class="loading-state"><div class="spinner"></div><p>加载中...</p></div>
</main>

<div id="cardModal" class="modal">
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-content">
    <button class="modal-close" data-close="1">✕</button>
    <div class="modal-tag" id="modalTag"></div>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>
<script src="./js/app.js"></script>
</body>
</html>
